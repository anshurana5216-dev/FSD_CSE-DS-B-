<!DOCTYPE html>
<html>
<head>
    <title>Student Table</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        table {
            width: 70%;
            border-collapse: collapse;
            font-size: 22px;
            text-align: center;
        }

        th, td {
            border: 2px solid black;
            padding: 20px;
        }

        th {
            background-color: lightblue;
        }
    </style>
</head>

<body>

    <table>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Course</th>
            <th>Branch</th>
        </tr>

        <tr>
            <td>101</td>
            <td>Anshu</td>
            <td>B.Tech</td>
            <td>CSE</td>
        </tr>

        <tr>
            <td>102</td>
            <td>Rahul</td>
            <td>B.Tech</td>
            <td>IT</td>
        </tr>

        <tr>
            <td>103</td>
            <td>Priya</td>
            <td>B.Tech</td>
            <td>ECE</td>
        </tr>
    </table>

</body>
</html>
