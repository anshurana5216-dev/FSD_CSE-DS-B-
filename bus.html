<html lang="en">
<head>

</head>
<body >

        </select>

     <!-- <input type="text"> -->

     <P> User Age: <input type="number"></P>
     <p> User Aadhar No.:  <input type="text"></p>
     <br>
     <center>
     <h3> Bus Booking Options</h3>

        <input type="radio" name="bus" value="AC">AC
        <input type="radio" name="bus" value="Non-AC">Non-AC

     </p></center>

     
</div>
